[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duomind"
version = "0.1.0"
description = "Local OpenAI-compatible server pairing a small LLM with TypeSafe AI's Jev for classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DuoMind Contributors"}
]
keywords = ["llm", "classification", "jev", "typesafe", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "questionary>=2.0.0",
    "platformdirs>=4.3.0",
    "keyring>=25.4.0",
    "huggingface-hub>=0.25.0",
    "typesafe-sdk>=0.2.0",
    "psutil>=6.0.0",
    "PyMuPDF>=1.24.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
duomind = "duomind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duomind = ["models.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
